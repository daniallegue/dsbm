# @package _global_
Method: DBDSB

first_num_iter: ${num_iter}

# schedule -- triangular g^2(t): 0.001 at t=0,T, peak 0.05 at t=T/2
sde: riemannian
gamma_max: 0.05
gamma_min: 0.001
gamma_space: linspace

symmetric_gamma: True

first_coupling: ind # score_divergence requires ref; log_bridge requires ind; bridge_matching supports either

mean_match: True   # required by bridge_matching; unused by score_divergence/log_bridge
loss_scale: False
std_trick: False

loss_type: log_bridge # bridge_matching | score_divergence | log_bridge (R-IMF)
n_div_probes: 1     # Hutchinson trace probes per step, score_divergence only
n_bridge_steps: null # null -> num_steps
r_imf_eps: null   
